schemaVersion: 2.2.0
metadata:
  name: mydevfile
components:
  - name: udi
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.31.1
      memoryLimit: 4096Mi
      cpuLimit: '2'
      mountSources: true
      env:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: '0'
        - name: TESTSEB
          value: 'seb'
        - name: KUBEDOCK_ENABLED
          value: 'true'
